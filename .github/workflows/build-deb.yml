name: Build FreeMulo Rootless DEB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Makefile'
      - 'control'
      - 'Tweak.xm'
      - '.github/workflows/build-deb.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang git perl make dpkg-dev

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$GITHUB_WORKSPACE/theos"
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/theos/bin" >> "$GITHUB_PATH"

      - name: Install iOS SDK
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          mkdir -p "$THEOS/sdks"
          cp -R /tmp/sdks/iPhoneOS*.sdk "$THEOS/sdks/" || true

      - name: Build Rootless package
        run: |
          make package FINALPACKAGE=1

      - name: Collect DEB
        run: |
          mkdir -p dist
          find packages -maxdepth 1 -type f -name '*.deb' -exec cp {} dist/ \;
          test -n "$(find dist -maxdepth 1 -name '*.deb' -print -quit)"

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: freemulo-rootless-deb
          path: dist/*.deb
          if-no-files-found: error
