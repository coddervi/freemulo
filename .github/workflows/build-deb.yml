name: Build FreeMulo Rootless DEB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Makefile'
      - 'control'
      - 'Tweak.xm'
      - '.github/workflows/build-deb.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang git perl make dpkg-dev fakeroot curl unzip xz-utils libtinfo6

      - name: Install Theos with toolchain and SDK
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain and SDK
        run: |
          test -x "$THEOS/toolchain/linux/iphone/bin/clang"
          test -d "$THEOS/sdks"
          find "$THEOS/sdks" -maxdepth 1 -type d -name '*.sdk' -print

      - name: Build Rootless package
        run: |
          make package FINALPACKAGE=1

      - name: Collect DEB
        run: |
          mkdir -p dist
          find packages -maxdepth 1 -type f -name '*.deb' -exec cp {} dist/ \;
          test -n "$(find dist -maxdepth 1 -name '*.deb' -print -quit)"

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: freemulo-rootless-deb
          path: dist/*.deb
          if-no-files-found: error
